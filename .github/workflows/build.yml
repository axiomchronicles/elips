name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."
      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DELIPS_BUILD_PYTHON=ON -DELIPS_BUILD_CLI=ON

      - name: Build C++ & Python Extension
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: C++ Test Suite (ctest)
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Install Python Test Dependencies
        run: python -m pip install pytest mypy

      - name: Python Test Suite (pytest)
        shell: bash
        run: PYTHONPATH=bindings/python python -m pytest tests/python -q
