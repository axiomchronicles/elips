name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (sanitizers)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DELIPS_SANITIZE=address
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (TSan)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DELIPS_SANITIZE=thread
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  default-build-has-no-gpu:
    name: Default Linux build excludes the GPU engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure with no flags at all
        run: cmake -S . -B build -G Ninja
      - name: Assert the GPU engine was not enabled
        run: |
          if grep -q "ELIPS_GPU_ENABLED" build/CMakeFiles/elips_core.dir/*.d 2>/dev/null; then
            echo "ELIPS_GPU_ENABLED leaked into the default Linux build"; exit 1
          fi
          if [ -d build/src/gpu_engine ]; then
            echo "gpu_engine was configured on a non-Apple default build"; exit 1
          fi
          if cmake --build build --target help 2>/dev/null | grep -q elips_gpu; then
            echo "elips_gpu target exists in the default Linux build"; exit 1
          fi
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (export compile commands)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF
      - name: Analyze core sources
        run: |
          clang-tidy -p build $(git ls-files 'src/*.cpp')

  fuzz:
    name: Fuzz the WAL parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (libFuzzer)
        run: >
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DELIPS_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF
          -DELIPS_BUILD_BENCH=OFF -DELIPS_BUILD_CLI=OFF
          -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target elips_fuzz_wal -j
      - name: Short fuzz run
        run: ./build-fuzz/elips_fuzz_wal -max_total_time=120 -print_final_stats=1

  python:
    name: Python bindings (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build module
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DELIPS_ENABLE_PYTHON=ON -DBUILD_TESTING=OFF -DELIPS_BUILD_CLI=OFF
          cmake --build build --config Release --target elips_pymodule -j
      - name: Import + smoke test
        shell: bash
        run: |
          PYTHONPATH=bindings/python python3 examples/python/01_getting_started.py || PYTHONPATH=bindings/python python examples/python/01_getting_started.py
      - name: Install test tooling
        run: python -m pip install --upgrade pytest mypy
      - name: Python test suite
        shell: bash
        run: PYTHONPATH=bindings/python python -m pytest tests/python -q
      - name: Doctests
        shell: bash
        run: >
          PYTHONPATH=bindings/python python -m pytest --doctest-modules
          bindings/python/elips/ -q
      - name: Type checking
        shell: bash
        run: cd bindings/python && python -m mypy --strict elips/

  # --------------------------------------------------------------------------
  # Phase 8B: docs-snippet harness. Builds the module, then executes the
  # python code blocks in the docs tree against it. The seed doc MUST pass
  # (proves the harness end-to-end); the full tree is report-only until the
  # Phase 9 docs carry no-exec markers.
  # --------------------------------------------------------------------------
  docs-snippets:
    name: Docs snippet harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build module
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DELIPS_ENABLE_PYTHON=ON -DBUILD_TESTING=OFF -DELIPS_BUILD_CLI=OFF
          cmake --build build --config Release --target elips_pymodule -j
      - name: Harness self-test
        run: python scripts/run_doc_snippets.py --selftest
      - name: Seed doc must execute cleanly
        run: PYTHONPATH=bindings/python python scripts/run_doc_snippets.py docs/_redesign/_snippets_seed.md
      - name: Full docs tree (report-only until Phase 9)
        run: PYTHONPATH=bindings/python python scripts/run_doc_snippets.py --allow-fail docs

  # --------------------------------------------------------------------------
  # EXPERIMENTAL — GPU backend compile-checks. These prove the CUDA / HIP
  # translation units compile against the real CMake wiring; they do NOT run
  # on a GPU. They need x86_64 + nvcc/hipcc inside a vendor container, so they
  # are non-blocking (continue-on-error) and run on the amd64 Linux runner.
  # --------------------------------------------------------------------------
  cuda-compile:
    name: "EXPERIMENTAL: CUDA compile-check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile the CUDA backend (nvcc + cuBLAS, no GPU)
        run: scripts/ci/compile_cuda.sh

  hip-compile:
    name: "EXPERIMENTAL: HIP/ROCm compile-check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile the HIP backend (hipcc + hipBLAS, no GPU)
        run: scripts/ci/compile_hip.sh
