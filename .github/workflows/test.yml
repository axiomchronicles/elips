name: test

on:
  push:
    branches: [main]

jobs:
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (sanitizers)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DELIPS_SANITIZE=address
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (TSan)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DELIPS_SANITIZE=thread
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  default-build-has-no-gpu:
    name: Default Linux build excludes the GPU engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure with no flags at all
        run: cmake -S . -B build -G Ninja
      - name: Assert the GPU engine was not enabled
        run: |
          if grep -q "ELIPS_GPU_ENABLED" build/CMakeFiles/elips_core.dir/*.d 2>/dev/null; then
            echo "ELIPS_GPU_ENABLED leaked into the default Linux build"; exit 1
          fi
          if [ -d build/src/gpu_engine ]; then
            echo "gpu_engine was configured on a non-Apple default build"; exit 1
          fi
          if cmake --build build --target help 2>/dev/null | grep -q elips_gpu; then
            echo "elips_gpu target exists in the default Linux build"; exit 1
          fi
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (export compile commands)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DELIPS_BUILD_TESTS=OFF
      - name: Analyze core sources
        run: |
          clang-tidy -p build $(git ls-files 'src/*.cpp')

  fuzz:
    name: Fuzz the WAL parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (libFuzzer)
        run: >
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DELIPS_BUILD_FUZZERS=ON -DELIPS_BUILD_TESTS=OFF
          -DELIPS_BUILD_BENCH=OFF -DELIPS_BUILD_CLI=OFF
          -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target elips_fuzz_wal -j
      - name: Short fuzz run
        run: ./build-fuzz/elips_fuzz_wal -max_total_time=120 -print_final_stats=1

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build module
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DELIPS_BUILD_PYTHON=ON -DELIPS_BUILD_TESTS=OFF -DELIPS_BUILD_CLI=OFF
          cmake --build build --target elips_pymodule -j
      - name: Import + smoke test
        run: |
          PYTHONPATH=bindings/python python3 examples/python/01_getting_started.py
      - name: Install test tooling
        run: python3 -m pip install --upgrade pytest mypy
      - name: Python test suite
        run: PYTHONPATH=bindings/python python3 -m pytest tests/python -q
      - name: Doctests
        run: >
          PYTHONPATH=bindings/python python3 -m pytest --doctest-modules
          bindings/python/elips/ -q
      - name: Type checking
        run: cd bindings/python && python3 -m mypy --strict elips/
