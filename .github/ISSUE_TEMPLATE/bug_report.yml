name: Bug Report
description: Create a report to help us improve ELIPS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out the sections below to help us reproduce and resolve the problem.
  - type: textarea
    id: describe-bug
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open database with `elips.open(...)`
        2. Execute query `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: code-snippet
    attributes:
      label: Minimal Reproducible Code Example
      description: If applicable, provide a minimal C++ or Python snippet reproducing the bug.
      render: python
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x86_64 / aarch64)
        - macOS (Apple Silicon / Intel)
        - Windows (x64)
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Compiler version, Python version, ELIPS version, C++ standard, etc.
      placeholder: |
        - ELIPS Version: 1.0.0
        - Python Version: 3.12
        - Compiler: GCC 13 / Clang 17 / MSVC 19.38
        - CMake Version: 3.28
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Crash Logs or Error Output
      description: Paste any relevant error messages, stack tracebacks, or terminal logs.
      render: shell
