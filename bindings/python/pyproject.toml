[build-system]
requires = ["setuptools>=61.0.0", "wheel", "cmake>=3.24", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "elips"
version = "1.1.0"
description = "Embedded local vector database (SQLite for vectors)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Pawan Kumar", email = "aegis.invincible@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/axiomchronicles/elips"
Repository = "https://github.com/axiomchronicles/elips.git"
Issues = "https://github.com/axiomchronicles/elips/issues"

[tool.setuptools]
packages = [
    "elips",
    "elips._internal",
    "elips.collection",
    "elips.config",
    "elips.database",
    "elips.gpu",
    "elips.quantization",
    "elips.query",
    "elips.records",
    "elips.search",
    "elips.storage",
]
package-dir = {"" = "."}
package-data = {"elips" = ["py.typed", "_core.pyi"]}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403", "F405", "E402"]
"**/core.py" = ["F401", "F403", "F405", "E402"]
"**/errors.py" = ["E402", "F401"]
"**/modern.py" = ["E402", "F401"]
"**/exceptions.py" = ["E402", "F401"]
"**/typing.py" = ["E402", "E501"]
"**/_native.py" = ["F401", "F403", "F405", "E402"]
"**/native.py" = ["F401", "F403", "F405"]
"**/_internal/*.py" = ["E501", "E402"]
# These modules document each method with a leading signature line, which is
# routinely wider than the code limit. Inherited from the pre-split layout,
# where the same exemption applied to _modern/*.
"**/collection/*.py" = ["E501"]
"**/config/connect.py" = ["E501"]
"**/database/*.py" = ["E501"]
"**/gpu/*.py" = ["E501"]
"**/records/*.py" = ["E501"]
"**/_core.pyi" = ["E501", "N818"]
"**/setup.py" = ["E501"]
"**/test.py" = ["E501"]
"**/tests/**/*.py" = ["E501"]
"**/examples/**/*.py" = ["E501"]


