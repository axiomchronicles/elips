[build-system]
requires = ["setuptools>=61.0.0", "wheel", "cmake>=3.24", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "elips"
# Version is NOT hard-coded here: it is scraped from the top-level CMakeLists
# `project(... VERSION ...)` by setup.py (_read_version). CMake is the single
# source of truth, so the C++ project, the compiled extension's __version__, and
# the wheel metadata can never drift apart.
dynamic = ["version"]
description = "Embedded local vector database (SQLite for vectors)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Pawan Kumar", email = "aegis.invincible@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# numpy is a real runtime dependency: the Index API (elips.IndexFlat/IVF*) takes
# and returns float32 numpy arrays. 1.x and 2.x are both ABI-compatible with how
# the bindings consume arrays, so the floor is loose and 3.x is excluded.
dependencies = [
    "numpy>=1.21,<3",
]

# ----------------------------------------------------------------------------
# Wheel split rationale (cpu vs gpu), mirroring FAISS's faiss-cpu / faiss-gpu
# packaging model (docs/_redesign/_faiss_3F.md §6):
#   * macOS arm64  -> ONE wheel ships CPU (NEON) + Metal together. Metal is a
#     system framework (no CUDA-style external toolkit), so bundling it costs
#     nothing and needs no separate SKU.
#   * Linux/Windows x86_64 -> CPU-only wheel (generic/avx2 via ELIPS_OPT_LEVEL).
#   * CUDA / HIP(ROCm) -> NOT shipped as wheels: they need a matching toolkit +
#     driver on the build and target host, so they are build-from-source
#     (-DELIPS_ENABLE_CUDA=ON / -DELIPS_ENABLE_ROCM=ON) rather than pip installs.
# A single-tier wheel is built today (ELIPS_OPT_LEVEL); FAISS-style runtime
# dispatch ("dd") is deferred until the x86 wheel matrix actually hurts.
# ----------------------------------------------------------------------------

[project.urls]
Homepage = "https://github.com/axiomchronicles/elips"
Repository = "https://github.com/axiomchronicles/elips.git"
Issues = "https://github.com/axiomchronicles/elips/issues"

[tool.setuptools]
packages = [
    "elips",
    "elips._internal",
    "elips.collection",
    "elips.config",
    "elips.database",
    "elips.gpu",
    "elips.quantization",
    "elips.query",
    "elips.records",
    "elips.search",
    "elips.storage",
]
package-dir = {"" = "."}
package-data = {"elips" = ["py.typed", "_core.pyi"]}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403", "F405", "E402"]
"**/core.py" = ["F401", "F403", "F405", "E402"]
"**/errors.py" = ["E402", "F401"]
"**/modern.py" = ["E402", "F401"]
"**/exceptions.py" = ["E402", "F401"]
"**/typing.py" = ["E402", "E501"]
"**/_native.py" = ["F401", "F403", "F405", "E402"]
"**/native.py" = ["F401", "F403", "F405"]
"**/_internal/*.py" = ["E501", "E402"]
# These modules document each method with a leading signature line, which is
# routinely wider than the code limit. Inherited from the pre-split layout,
# where the same exemption applied to _modern/*.
"**/collection/*.py" = ["E501"]
"**/config/connect.py" = ["E501"]
"**/database/*.py" = ["E501"]
"**/gpu/*.py" = ["E501"]
"**/records/*.py" = ["E501"]
"**/_core.pyi" = ["E501", "N818"]
"**/setup.py" = ["E501"]
"**/test.py" = ["E501"]
"**/tests/**/*.py" = ["E501"]
"**/examples/**/*.py" = ["E501"]


